<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novata nvt_0.7 beta</title>
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="edit-guides-layer hidden" id="edit-guides-layer">
    <div class="guide-crosshair" id="guide-crosshair" title="Screen Center">
      <div class="crosshair-h"></div>
      <div class="crosshair-v"></div>
      <div class="crosshair-center-dot"></div>
    </div>
    <div class="guide-line guide-line-h" id="guide-line-h"></div>
    <div class="guide-line guide-line-v" id="guide-line-v"></div>
    <div class="guide-snap-line guide-snap-x hidden" id="guide-snap-line-x"></div>
    <div class="guide-snap-line guide-snap-y hidden" id="guide-snap-line-y"></div>
  </div>

  <canvas id="visualizer-canvas"></canvas>

  <audio id="inapp-audio-player" preload="auto" crossorigin="anonymous"></audio>

  <div class="glass-player-card mat-glass" id="player-card">
    
    <div class="resize-handle handle-n" data-dir="n"></div>
    <div class="resize-handle handle-s" data-dir="s"></div>
    <div class="resize-handle handle-w" data-dir="w"></div>
    <div class="resize-handle handle-e" data-dir="e"></div>
    <div class="resize-handle handle-nw" data-dir="nw"></div>
    <div class="resize-handle handle-ne" data-dir="ne"></div>
    <div class="resize-handle handle-sw" data-dir="sw"></div>
    <div class="resize-handle handle-se" data-dir="se"></div>

    <div class="drag-hint hidden" id="drag-hint">
      <i class="bi bi-arrows-move"></i>
      <span>Drag card to move • Drag edges to resize • Right-click or Esc to finish</span>
    </div>

    <div class="player-inner-content">
      
      <div class="card-album-wrap">
        <div class="album-disc-scallop" id="album-disc">
          <i class="bi bi-disc disc-spinning" id="album-icon"></i>
          <img id="album-thumb" class="album-thumb-img hidden" alt="Album Cover">
        </div>
        <div class="source-tag" id="source-tag" title="Music Source">
          <i class="bi bi-music-note-beamed" id="source-icon"></i>
        </div>
      </div>

      <div class="card-info-wrap">
        <div class="track-meta">
          <div class="track-title" id="track-title">Ready to listen</div>
          <div class="track-artist-row">
            <span class="track-artist" id="track-artist">Spotify / YouTube / Music Player</span>
            <span class="track-time-badge" id="track-time">0:00</span>
          </div>
        </div>

        <div class="track-progress-bar" id="progress-container" title="Click to seek">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <div class="control-row">
          <div class="control-group-playback">
            <button class="mono-btn btn-small" id="btn-shuffle" title="Shuffle">
              <i class="bi bi-shuffle"></i>
            </button>

            <button class="mono-btn btn-small" id="btn-prev" title="Previous">
              <i class="bi bi-skip-start-fill"></i>
            </button>

            <button class="mono-btn btn-pill-play" id="btn-play-pause" title="Play / Pause">
              <i class="bi bi-play-fill" id="play-pause-icon"></i>
            </button>

            <button class="mono-btn btn-small" id="btn-next" title="Next">
              <i class="bi bi-skip-end-fill"></i>
            </button>

            <button class="mono-btn btn-small" id="btn-repeat" title="Repeat">
              <i class="bi bi-repeat" id="repeat-icon"></i>
            </button>
          </div>

          <div class="control-divider"></div>

          <div class="control-group-tools">
            <div class="hamburger-menu-wrap" id="hamburger-menu-wrap">
              
              <button class="mono-btn btn-small" id="btn-hamburger" title="Menu">
                <i class="bi bi-list"></i>
              </button>

              <div class="hamburger-dropdown hidden" id="hamburger-dropdown">
                
                <button class="hamburger-item" id="btn-toggle-lyrics" title="Toggle Lyrics">
                  <i class="bi bi-chat-square-quote"></i>
                  <span>Lyrics</span>
                </button>

                <button class="hamburger-item" id="btn-edit-position" title="Move & Resize Widget">
                  <i class="bi bi-arrows-move"></i>
                  <span>Move</span>
                </button>

                <button class="hamburger-item" id="btn-open-settings" title="Settings">
                  <i class="bi bi-gear-fill"></i>
                  <span>Settings</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="glass-player-card mat-glass glass-lyrics-card" id="lyrics-card">
    
    <div class="resize-handle handle-n" data-dir="n"></div>
    <div class="resize-handle handle-s" data-dir="s"></div>
    <div class="resize-handle handle-w" data-dir="w"></div>
    <div class="resize-handle handle-e" data-dir="e"></div>
    <div class="resize-handle handle-nw" data-dir="nw"></div>
    <div class="resize-handle handle-ne" data-dir="ne"></div>
    <div class="resize-handle handle-sw" data-dir="sw"></div>
    <div class="resize-handle handle-se" data-dir="se"></div>

    <div class="lyrics-sync-bar hidden" id="lyrics-sync-bar" title="Lyrics Timing Calibration">
      <button class="mono-sync-btn" id="btn-sync-delay" title="Delay lyrics (-0.2s)">
        <i class="bi bi-dash"></i>
      </button>
      <span class="sync-offset-label" id="sync-offset-label">-0.8s</span>
      <button class="mono-sync-btn" id="btn-sync-advance" title="Advance lyrics (+0.2s)">
        <i class="bi bi-plus"></i>
      </button>
    </div>

    <div class="lyrics-card-inner">
      <div class="lyrics-scroll-container" id="lyrics-scroll-container">
        <div class="lyrics-lines-wrapper" id="lyrics-lines-wrapper">
          
        </div>
      </div>
    </div>
  </div>

  <script src="visualizer.js"></script>
  <script src="app.js"></script>
</body>
</html>
