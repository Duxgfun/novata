<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novata nvt_0.4 beta</title>
  <link rel="stylesheet" href="../assets/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Canvas sóng âm: 100% trong suốt, không hộp nền, mặc định xuyên chuột -->
  <canvas id="visualizer-canvas"></canvas>

  <!-- Trình phát âm thanh Native Stream kết nối trực tiếp Web Audio API với CORS -->
  <audio id="inapp-audio-player" preload="auto" crossorigin="anonymous"></audio>

  <!-- Thẻ điều khiển nhạc widget nổi trên màn hình (Có thể kéo thả vị trí & co giãn kích thước) -->
  <div class="glass-player-card mat-glass" id="player-card">
    <!-- 8 Điểm neo co giãn kích cỡ giống cửa sổ Windows (Resize Handles) -->
    <div class="resize-handle handle-n" data-dir="n"></div>
    <div class="resize-handle handle-s" data-dir="s"></div>
    <div class="resize-handle handle-w" data-dir="w"></div>
    <div class="resize-handle handle-e" data-dir="e"></div>
    <div class="resize-handle handle-nw" data-dir="nw"></div>
    <div class="resize-handle handle-ne" data-dir="ne"></div>
    <div class="resize-handle handle-sw" data-dir="sw"></div>
    <div class="resize-handle handle-se" data-dir="se"></div>

    <!-- Bảng chỉ dẫn khi ở chế độ chỉnh vị trí và kích thước (Edit Mode) -->
    <div class="drag-hint hidden" id="drag-hint">
      <i class="bi bi-arrows-move"></i>
      <span>Drag card to move • Drag edges to resize • Click Done when finished</span>
    </div>

    <div class="player-inner-content">
      <!-- Đĩa nhạc / Bìa bài hát -->
      <div class="card-album-wrap">
        <div class="album-disc-scallop" id="album-disc">
          <i class="bi bi-disc disc-spinning" id="album-icon"></i>
          <img id="album-thumb" class="album-thumb-img hidden" alt="Album Cover">
        </div>
        <div class="source-tag" id="source-tag" title="Music Source">
          <i class="bi bi-music-note-beamed" id="source-icon"></i>
        </div>
      </div>

      <!-- Thông tin bài hát & Tiến trình -->
      <div class="card-info-wrap">
        <div class="track-meta">
          <div class="track-title" id="track-title">Ready to listen</div>
          <div class="track-artist-row">
            <span class="track-artist" id="track-artist">Spotify / YouTube / Music Player</span>
            <span class="track-time-badge" id="track-time">0:00</span>
          </div>
        </div>

        <!-- Thanh tiến trình bài hát -->
        <div class="track-progress-bar" id="progress-container" title="Click to seek">
          <div class="progress-fill" id="progress-fill"></div>
        </div>

        <!-- Cụm nút điều khiển -->
        <div class="control-row">
          <div class="control-group-playback">
            <button class="mono-btn btn-small" id="btn-shuffle" title="Shuffle">
              <i class="bi bi-shuffle"></i>
            </button>

            <button class="mono-btn btn-small" id="btn-prev" title="Previous">
              <i class="bi bi-skip-start-fill"></i>
            </button>

            <!-- Nút Play/Pause viên thuốc nổi bật -->
            <button class="mono-btn btn-pill-play" id="btn-play-pause" title="Play / Pause">
              <i class="bi bi-play-fill" id="play-pause-icon"></i>
            </button>

            <button class="mono-btn btn-small" id="btn-next" title="Next">
              <i class="bi bi-skip-end-fill"></i>
            </button>

            <button class="mono-btn btn-small" id="btn-repeat" title="Repeat">
              <i class="bi bi-repeat" id="repeat-icon"></i>
            </button>
          </div>

          <div class="control-divider"></div>

          <div class="control-group-tools">
            <!-- Nút bật chế độ di chuyển & co giãn kích thước (Move & Resize) -->
            <button class="mono-btn btn-small" id="btn-edit-position" title="Move & Resize Widget">
              <i class="bi bi-arrows-move"></i>
            </button>

            <!-- Nút Mở Cài đặt -->
            <button class="mono-btn btn-small" id="btn-open-settings" title="Settings">
              <i class="bi bi-gear-fill"></i>
            </button>
          </div>

          <!-- Nút xác nhận vị trí & kích cỡ khi ở chế độ Edit Mode (Done) -->
          <button class="mono-btn btn-small btn-confirm-pos hidden" id="btn-confirm-position" title="Save position and size">
            <i class="bi bi-check-lg"></i>
            <span>Done</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="visualizer.js"></script>
  <script src="app.js"></script>
</body>
</html>
