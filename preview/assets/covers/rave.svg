<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="raveGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050508"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#020305"/>
    </linearGradient>
    <radialGradient id="raveCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#7928ca" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff0080" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Nen den huyen bi -->
  <rect width="400" height="400" fill="url(#raveGrad)"/>
  <!-- Vang sang trung tam -->
  <circle cx="200" cy="200" r="160" fill="url(#raveCenter)"/>
  <!-- Cac hinh khoi da giac xoay Neon -->
  <polygon points="200,60 330,135 330,265 200,340 70,265 70,135" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.8"/>
  <polygon points="200,85 305,145 305,255 200,315 95,255 95,145" fill="none" stroke="#ff0080" stroke-width="2" opacity="0.6" transform="rotate(30 200 200)"/>
  <polygon points="200,110 280,155 280,245 200,290 120,245 120,155" fill="none" stroke="#7928ca" stroke-width="2.5" opacity="0.9" transform="rotate(60 200 200)"/>
  <circle cx="200" cy="200" r="50" fill="#090a10" stroke="#00f0ff" stroke-width="3"/>
  <!-- Bieu tuong song am thanh o tam -->
  <line x1="175" y1="200" x2="175" y2="200" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <line x1="185" y1="185" x2="185" y2="215" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="195" y1="175" x2="195" y2="225" stroke="#ff0080" stroke-width="4" stroke-linecap="round"/>
  <line x1="205" y1="170" x2="205" y2="230" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="215" y1="185" x2="215" y2="215" stroke="#7928ca" stroke-width="4" stroke-linecap="round"/>
  <line x1="225" y1="200" x2="225" y2="200" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <!-- Tia laser neon chieu -->
  <line x1="0" y1="0" x2="400" y2="400" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="0" x2="0" y2="400" stroke="#ff0080" stroke-width="1" opacity="0.3"/>
  <!-- Chu tieu de -->
  <text x="200" y="380" text-anchor="middle" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="16" letter-spacing="8">ELECTRONIC RAVE</text>
</svg>
