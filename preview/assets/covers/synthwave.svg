<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0813"/>
      <stop offset="50%" stop-color="#2c124d"/>
      <stop offset="100%" stop-color="#08070d"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#ffee00"/>
    </linearGradient>
    <linearGradient id="gridGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Nen gradient troi dem retro -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  <!-- Mat troi Synthwave -->
  <circle cx="200" cy="180" r="90" fill="url(#sunGrad)"/>
  <!-- Cac duong cat mat troi ngang -->
  <rect x="100" y="160" width="200" height="4" fill="#1d0c36"/>
  <rect x="100" y="174" width="200" height="6" fill="#1d0c36"/>
  <rect x="100" y="190" width="200" height="9" fill="#1d0c36"/>
  <rect x="100" y="210" width="200" height="13" fill="#1d0c36"/>
  <rect x="100" y="234" width="200" height="18" fill="#1d0c36"/>
  <!-- Day nui phong cach Vector -->
  <polygon points="0,260 80,190 160,250 250,170 330,230 400,180 400,280 0,280" fill="#0f071c"/>
  <!-- Luoi phoi canh duong Grid neon -->
  <rect x="0" y="260" width="400" height="140" fill="url(#gridGrad)" opacity="0.3"/>
  <!-- Cac duong phoi canh tam giac -->
  <line x1="200" y1="260" x2="0" y2="400" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="200" y1="260" x2="80" y2="400" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="200" y1="260" x2="160" y2="400" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="200" y1="260" x2="240" y2="400" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="200" y1="260" x2="320" y2="400" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <line x1="200" y1="260" x2="400" y2="400" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <!-- Duong ngang luoi -->
  <line x1="0" y1="280" x2="400" y2="280" stroke="#ff007f" stroke-width="1.2" opacity="0.6"/>
  <line x1="0" y1="310" x2="400" y2="310" stroke="#ff007f" stroke-width="1.5" opacity="0.7"/>
  <line x1="0" y1="350" x2="400" y2="350" stroke="#ff007f" stroke-width="2" opacity="0.9"/>
  <!-- Chu ky hieu -->
  <text x="200" y="60" text-anchor="middle" fill="#ff77aa" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20" letter-spacing="8">80s SYNTHWAVE</text>
</svg>
