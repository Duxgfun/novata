<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="obsidianGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="45%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="glowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Nen den matte nham sang trong -->
  <rect width="1920" height="1080" fill="url(#obsidianGrad)"/>
  
  <!-- Cac duong geometric toi gian -->
  <circle cx="960" cy="540" r="420" stroke="url(#glowLine)" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="960" cy="540" r="280" stroke="url(#glowLine)" stroke-width="1" fill="none" opacity="0.6"/>
  <circle cx="960" cy="540" r="140" stroke="url(#glowLine)" stroke-width="0.8" fill="none" opacity="0.8"/>
  
  <line x1="200" y1="540" x2="1720" y2="540" stroke="url(#glowLine)" stroke-width="1" opacity="0.3"/>
  <line x1="960" y1="100" x2="960" y2="980" stroke="url(#glowLine)" stroke-width="1" opacity="0.3"/>
</svg>
