<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="bloomBackdrop" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="45%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="petal1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="petal2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="petal3" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="darkShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05060a" stop-opacity="0"/>
      <stop offset="85%" stop-color="#05060a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#05060a" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <!-- Nen chinh -->
  <rect width="1920" height="1080" fill="url(#bloomBackdrop)"/>

  <!-- Canh hoa Bloom phia sau -->
  <path d="M 650 680 C 600 400, 850 250, 1100 280 C 1350 310, 1450 550, 1300 750 C 1150 950, 800 920, 650 680 Z" fill="url(#petal1)" filter="blur(30px)"/>

  <!-- Cac lop canh hoa uon luon phong cach Windows 11 Bloom Dark -->
  <path d="M 720 620 C 680 430, 890 320, 1080 340 C 1270 360, 1340 540, 1220 700 C 1100 860, 820 830, 720 620 Z" fill="url(#petal2)" opacity="0.85"/>
  <path d="M 820 560 C 800 420, 940 350, 1070 380 C 1200 410, 1240 530, 1150 640 C 1060 750, 880 730, 820 560 Z" fill="url(#petal3)" opacity="0.9"/>
  <path d="M 890 520 C 880 430, 980 390, 1060 410 C 1140 430, 1160 510, 1100 580 C 1040 650, 930 630, 890 520 Z" fill="#93c5fd" opacity="0.3" filter="blur(10px)"/>

  <!-- Vung toi che phu day man hinh giup Taskbar va song am noi ro -->
  <rect width="1920" height="1080" fill="url(#darkShade)"/>
</svg>
