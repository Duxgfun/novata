<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030811"/>
      <stop offset="50%" stop-color="#06121f"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="ribbonGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#030811" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonViolet" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#030811" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#auroraSky)"/>
  
  <!-- Cac vet sang Aurora Borealis cuon luon -->
  <path d="M 0 350 Q 480 150 960 300 T 1920 220 L 1920 500 Q 1440 600 960 450 T 0 520 Z" fill="url(#ribbonGreen)" filter="blur(40px)"/>
  <path d="M 0 450 Q 520 280 1020 400 T 1920 320 L 1920 600 Q 1380 720 900 580 T 0 620 Z" fill="url(#ribbonViolet)" filter="blur(35px)"/>
  
  <!-- Nui tuyet silhouette o chan troi -->
  <polygon points="0,880 200,740 380,820 600,680 750,780 960,650 1150,750 1350,660 1560,780 1750,690 1920,810 1920,1080 0,1080" fill="#020408"/>
</svg>
