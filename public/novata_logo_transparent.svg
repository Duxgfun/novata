<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Logo 2D Flat Tối Giản (Nền trong suốt) -->
  <g transform="translate(100, 100)">
    <!-- 1. Viền ngoài / Lớp đế màu xanh cyan cong dưới cằm -->
    <path d="M 30,120 
             C 15,220 50,290 150,290 
             C 250,290 285,220 270,120 
             C 260,60 240,10 215,25 
             C 190,40 170,60 150,60 
             C 130,60 110,40 85,25 
             C 60,10 40,60 30,120 Z" 
          fill="#00D2FF"/>

    <!-- 2. Thân chính màu đen xanh đậm -->
    <path d="M 36,115 
             C 24,195 56,260 150,260 
             C 244,260 276,195 264,115 
             C 255,65 236,20 213,34 
             C 190,48 171,68 150,68 
             C 129,68 110,48 87,34 
             C 64,20 45,65 36,115 Z" 
          fill="#090D16"/>

    <!-- 3. Dải màu xanh chuyển tiếp ở đáy cằm -->
    <path d="M 52,220 
             C 75,255 110,265 150,265 
             C 190,265 225,255 248,220 
             C 230,245 190,256 150,256 
             C 110,256 70,245 52,220 Z" 
          fill="#0066FF"/>

    <!-- 4. Chi tiết sóng âm / mắt màu trắng -->
    <rect x="110" y="125" width="22" height="50" rx="11" fill="#FFFFFF"/>
    <rect x="168" y="125" width="22" height="50" rx="11" fill="#FFFFFF"/>
  </g>
</svg>
